# Build, type-check and unit-test on every push.
#
# WHY this did not exist: the repo had `smoke` and `smoke:remote` and nothing ran
# either of them — the only hit for `smoke:remote` across .github/, package.json and
# README.md was its own definition. That is the same failure mode as an assertion
# nobody wrote: a check that runs nowhere protects nothing, and there are now 58 unit
# tests whose whole point is to fail before a release rather than after one.
#
# WHAT IS DELIBERATELY NOT HERE: `npm run smoke`. It drives the real server against
# the live imqueue.org feeds and asserts things about RANKING, so a blog post
# published in a different repository could turn this job red. A scheduled job that
# cries wolf gets muted, and this one has to stay trustworthy. The smoke tests run
# locally and, more importantly, as a publish gate (`prepublishOnly`) and a deploy
# gate (deploy-worker.mjs) — the two moments where being wrong actually costs
# something.

name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED. The ranker is the imqueue/search-ranker submodule at
          # vendor/search-ranker, and scripts/copy-ranker.mjs — which every step below
          # reaches through `npm run ranker` — exits 1 without it. Not an optimisation:
          # without this, build, typecheck:worker, typecheck:test and test all fail, and
          # they fail for a reason that has nothing to do with the commit being checked.
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc on src/ — the same compile that produces the published tarball.
      - run: npm run build

      # The Worker is NOT covered by the build: it has its own tsconfig and is
      # bundled by wrangler, which is how it once sat five releases behind npm.
      - run: npm run typecheck:worker

      # The tests themselves are type-checked too. tsx strips types rather than
      # checking them, so without this a test could reference a symbol that no
      # longer exists and still run green.
      - run: npm run typecheck:test

      - run: npm test

      # NETWORKED, which is why it lives here and not in `npm test` or `npm run
      # verify` — those are the pre-publish gate and should not need GitHub to be up.
      #
      # `npm run smoke` is deliberately excluded from this workflow (a blog post
      # published in another repo could turn it red), so this is the only thing in CI
      # that looks across the repository boundary at all. It compares ENGINE_V and not
      # the SHA: a UI-only commit to search.js never turns it red, and when it does go
      # red it means this server would rank the live feeds differently from
      # imqueue.org's own search box.
      - name: npm run check:ranker-engine (does the pinned engine still match master?)
        if: always()
        run: npm run check:ranker-engine
